<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>小學家長端 - 輕量課表管理</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; color: #333; }
        .card { background: #f9f9f9; border: 1px solid #ddd; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 15px; box-sizing: border-box; }
        button { background: #0070f3; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0051a2; }
        pre { background: #eee; padding: 10px; border-radius: 4px; white-space: pre-wrap; word-wrap: break-word; }
    </style>
</head>
<body>

    <h1>🎒 小朋友課表與便條</h1>
    
    <div class="card">
        <h3>目前課表內容 (從 GitHub 讀取)</h3>
        <pre id="data-view">載入中...</pre>
    </div>

    <div class="card">
        <h3>編輯與更新資料</h3>
        <label>GitHub Personal Access Token (具有寫入權限):</label>
        <input type="password" id="api-token" placeholder="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">
        
        <label>修改 JSON 內容:</label>
        <textarea id="json-input" rows="6"></textarea>
        
        <button onclick="saveToGitHub()">儲存並同步至 GitHub</button>
        <p id="status-msg" style="font-weight: bold; margin-top: 10px;"></p>
    </div>

<script>
      const REPO_OWNER = "ntactw-vendee";
    const REPO_NAME = "family-dashboard";
    const FILE_PATH = "data.json";

    // 寫入/更新依然使用 GitHub API
    const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;
    let fileSha = ""; 
    // 1. 讀取：直接抓 Cloudflare 上的 data.json
    async function loadData() {
        try {
            const response = await fetch("./data.json?t=" + new Date().getTime());
            if (!response.ok) throw new Error("無法取得遠端檔案");
            
            const data = await response.json();
            const prettyJson = JSON.stringify(data, null, 2);
            
            document.getElementById("data-view").textContent = prettyJson;
            document.getElementById("json-input").value = prettyJson;
        } catch (error) {
            document.getElementById("data-view").textContent = "讀取失敗：" + error.message;
        }
    }



    // 2. 寫入/更新 GitHub 上的 JSON 資料
    async function saveToGitHub() {
        const token = document.getElementById("api-token").value.trim();
        const newContent = document.getElementById("json-input").value;
        const statusMsg = document.getElementById("status-msg");

        if (!token) {
            alert("請先輸入 GitHub Token！");
            return;
        }

        // 確保輸入的是合法的 JSON 格式
        try {
            JSON.parse(newContent);
        } catch (e) {
            alert("❌ 錯誤：輸入的內容不是合法的 JSON 格式！");
            return;
        }

        statusMsg.style.color = "blue";
        statusMsg.textContent = "正在取得檔案驗證值 (SHA)...";

        try {
            // 步驟 A：在寫入前先透過 API 取得最新的 fileSha
            const getRes = await fetch(apiUrl, {
                headers: { "Authorization": `Bearer ${token}` }
            });
            if (getRes.ok) {
                const fileInfo = await getRes.json();
                fileSha = fileInfo.sha;
            }

            statusMsg.textContent = "正在同步至 GitHub...";

            // 步驟 B：將修改後的文字轉成 Base64
            const encodedContent = btoa(unescape(encodeURIComponent(newContent)));

            // 步驟 C：發送 PUT 請求寫入
            const response = await fetch(apiUrl, {
                method: "PUT",
                headers: {
                    "Authorization": `Bearer ${token}`,
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    message: "Update schedule via Cloudflare Pages web interface",
                    content: encodedContent,
                    sha: fileSha 
                })
            });

            if (response.ok) {
                const result = await response.json();
                fileSha = result.content.sha; // 更新 SHA
                statusMsg.style.color = "green";
                statusMsg.textContent = "✅ 儲存成功！畫面已同步更新。";
                loadData(); // 重新載入畫面
            } else {
                const errData = await response.json();
                throw new Error(errData.message);
            }
        } catch (error) {
            statusMsg.style.color = "red";
            statusMsg.textContent = "❌ 儲存失敗：" + error.message;
        }
    }

    // 網頁載入時執行讀取
    loadData();
</script>

</body>
</html>
